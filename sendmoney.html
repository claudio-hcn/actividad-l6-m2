<!DOCTYPE html>
<html>

<head>
  <title>Wallet - Enviar Dinero</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      padding: 20px;
    }

    .container {
      max-width: 400px;
      margin: 0 auto;
    }
  </style>
</head>
<script>
  if (!localStorage.getItem('loggedIn')) {
    window.location.href = 'index.html';
  }
</script>

<body class="bg-dark">

  <div class="container bg-secondary p-3">
    <h2 class="text-warning text-center">Enviar Dinero</h2>
    <form>
      <div class="form-group bg-light p-1">
        <label>Dinero en cuenta:</label>
        <h3 id="monto" class="text-center"></h3>
      </div>

      <h5 class="text-light text-center">Lista Contactos</h5>
      <button type="button" class="btn btn-primary btn-block my-2" data-toggle="modal" data-target="#modalContacto">
        Agregar nuevo contacto
      </button>
      <div>
        <ul id="contactList" class="list-group"></ul>
      </div>
    </form>
    <div class="form-group mt-3">
      <label class="text-light">Seleccione un contacto e ingrese el monto a enviar</label>
      <input type="number" id="montoEnvio" class="form-control" placeholder="ingrese el monto">
    </div>

    <button class="btn btn-primary btn-block" id="btnEnviar">
      Enviar dinero
    </button>
    <div class="row mt-5">
      <div class="col">
        <a href="menu.html" class="btn btn-primary btn-block text-white">Volver al Menú Principal</a>
      </div>
      <div class="col">
        <a class="btn btn-danger btn-block text-white" id="logout"> Cerrar sesión</a>
      </div>
    </div>
    <div class="modal fade" id="modalContacto" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">

          <div class="modal-header">
            <h5 class="modal-title">Agregar contacto</h5>
            <button type="button" class="close" data-dismiss="modal">
              <span>&times;</span>
            </button>
          </div>

          <div class="modal-body">
            <form id="formContacto">
              <div class="form-group">
                <label>Nombre</label>
                <input type="text" class="form-control" id="nombre" required>
              </div>
              <div class="form-group">
                <label>Apellido</label>
                <input type="text" class="form-control" id="apellido" required>
              </div>
              <div class="form-group">
                <label>Numero de Cuenta</label>
                <input type="number" class="form-control" id="nro_cuenta" required>
              </div>
              <div class="form-group">
                <label for="banco" class="form-label">Banco</label>
                <select class="form-select" aria-label="Default select example" id="banco">
                  <option value="">Seleccione Banco</option>
                  <option value="1">Banco Estado</option>
                  <option value="2">Banco de Chile</option>
                  <option value="3">Banco Itau</option>
                  <option value="4">Banco Santander</option>
                  <option value="5">Mercado Pago</option>
                </select>
              </div>
              <button type="submit" class="btn btn-success btn-block">
                Guardar contacto
              </button>
            </form>
          </div>

        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
    <script>
      // --- Inicialización de variables ---
      let contactos = JSON.parse(localStorage.getItem('contactos')) || [];
      let contactoSeleccionado = null;

      // --- 1. Evento Submit del Formulario de Contacto ---
      $('#formContacto').on('submit', function (e) {
        e.preventDefault();

        const nombre = $('#nombre').val();
        const apellido = $('#apellido').val();
        const nro_cuenta = $('#nro_cuenta').val();
        const $selectBanco = $('#banco');

        // En jQuery, obtener el texto de la opción seleccionada es muy simple:
        const bancoTxt = $selectBanco.find('option:selected').text();

        if ($selectBanco.val() === "") {
          alert("Debe seleccionar un banco");
        } else {
          contactos.push({
            id: Date.now(),
            nombre,
            apellido,
            nro_cuenta,
            bancoTxt,
          });

          localStorage.setItem('contactos', JSON.stringify(contactos));

          renderContactos();

          $('#modalContacto').modal('hide');
          this.reset(); // 'this' refiere al formulario nativo
        }
      });

      // --- 2. Función Renderizar Contactos ---
      function renderContactos() {
        const $lista = $('#contactList');
        $lista.empty(); // Equivale a innerHTML = ''

        contactos.forEach(c => {
          // Creamos el elemento li con sus clases y texto
          const $li = $('<li>', {
            class: 'list-group-item list-group-item-action',
            text: `${c.nombre} ${c.apellido} - ${c.nro_cuenta} ${c.bancoTxt}`
          });

          // Evento click para seleccionar
          $li.on('click', function () {
            contactoSeleccionado = c;
            $('#contactList li').removeClass('active'); // Quita 'active' de todos
            $(this).addClass('active'); // Agrega 'active' al actual
          });

          $lista.append($li);
        });
      }

      // Llamada inicial
      renderContactos();

      // --- 3. Botón Enviar Dinero ---
      $('#btnEnviar').on('click', function () {
        const monto = Number($('#montoEnvio').val());
        let saldo = Number(localStorage.getItem('saldo')) || 0;

        if (!contactoSeleccionado) {
          alert('Seleccione un contacto');
          return;
        }

        if (monto <= 0) {
          alert('Monto inválido');
          return;
        }

        if (monto > saldo) {
          alert('Saldo insuficiente');
          return;
        }

        let nuevoSaldo = saldo - monto;
        localStorage.setItem('saldo', nuevoSaldo);

        alert(`Enviado $${monto.toLocaleString('es-CL')} a ${contactoSeleccionado.nombre}\nSu saldo actual es ${nuevoSaldo}`);

        registrarMovimiento('envio', contactoSeleccionado.nombre, monto);
        $('#montoEnvio').val('');
      });

      // --- 4. Registrar Movimiento ---
      function registrarMovimiento(tipo, contacto, monto) {
        let movimientos = JSON.parse(localStorage.getItem('movimientos')) || [];

        movimientos.unshift({
          tipo,
          contacto,
          monto,
          fecha: new Date().toLocaleString('es-CL')
        });

        localStorage.setItem('movimientos', JSON.stringify(movimientos));
        location.reload();
      }

      // --- 5. Logout ---
      $('#logout').on('click', function () {
        localStorage.removeItem('loggedIn');
        window.location.href = 'index.html';
      });

      // --- 6. Mostrar Saldo en Pantalla ---
      $(document).ready(function () {
        let saldo = Number(localStorage.getItem('saldo')) || 0;
        $('#monto').text('$' + saldo.toLocaleString('es-CL'));
      });
    </script>

</body>

</html>
